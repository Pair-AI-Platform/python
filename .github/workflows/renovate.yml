# Runs Renovate self-hosted on this repository, using the renovate(bot)-updater GitHub App.
# Updates the base tooling (apko, melange, Grype, cosign, GitHub Actions) and the upstream Python
# versions in melange/*.yaml when the Python Software Foundation publishes new releases.
name: renovate

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-checks: read
          permission-commit-statuses: read
          permission-vulnerability-alerts: read

      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_FORCE: '{"schedule": null}'
          RENOVATE_REQUIRE_CONFIG: 'optional'
          # Commits are authored by the App's bot user
          RENOVATE_GIT_AUTHOR: 'renovate-bot-updater[bot] <350416368+renovate-bot-updater[bot]@users.noreply.github.com>'
          # The only command a pull request may run: refreshing the Python release keys
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/update-python-release-keys\\.sh$"]'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}

