# Builds and tests every image on pull requests, natively on both architectures. Runs OpenSCAP
# and Grype; uploads the reports and writes the summary to the job. Does not publish, does not
# attest.
name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # build.yml also holds the publish job, and GitHub refuses to start a called workflow whose jobs
  # declare more permissions than the caller grants, even for jobs that are skipped. publish: false
  # skips that job, so nothing here is pushed, signed or attested.
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      publish: false
    secrets: inherit

